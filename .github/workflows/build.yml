name: Test, build and publish

on:
  push:
    branches: [main]
    # Watchtower redeploys the NAS containers whenever a new image lands, which
    # kills any job running inside the worker. A docs-only push has nothing to
    # deploy, so it should not restart production. (A push touching code and
    # docs together still builds: paths-ignore only skips when every changed
    # file matches.)
    paths-ignore: ["**.md"]
  pull_request:

# Workflow level, not job level. A job-level group is entered in test-finish
# order rather than push order, so two quick pushes could let the OLDER commit
# cancel the newer build and end up tagged :latest for Watchtower to deploy.
concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  build:
    # Publish only on pushes to main, never for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
