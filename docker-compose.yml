# foolwatch on the Synology DS1522+.
#
# One-time setup on the NAS — see the Deploy Playbook:
#   sudo mkdir -p /volume1/docker/foolwatch/data
#   sudo chown -R 1000 /volume1/docker/foolwatch/data   # trap #2, load-bearing
#   cd /volume1/docker/foolwatch
#   sudo docker-compose pull && sudo docker-compose up -d
#   curl -s http://localhost:8531/_stcore/health
#
# The ghcr package is public (the repo is public and the image holds no
# secrets — the database is excluded by .dockerignore), so no docker login
# is needed and Watchtower cannot die from an expired token.
#
# No Watchtower service here by design: one Watchtower per NAS already runs
# with --label-enable and adopts anything carrying the label below.

services:
  foolwatch-worker:
    image: ghcr.io/ty1999ler/motleyfool:latest
    container_name: foolwatch-worker
    command: ["python", "-m", "foolwatch.scheduler"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      TZ: America/New_York
      FOOLWATCH_DAILY_AT: "18:30"
      FOOLWATCH_BACKFILL: "1"
      # Measured: fool.com allows roughly 300 requests per 10 minutes (~0.5/s)
      # however fast you burst. Bursting just trips the throttle sooner, and a
      # tripped throttle once escalated to a 23-hour ban. So crawl below the
      # threshold continuously instead of sprinting and stalling: 0.4/s is
      # ~34,000 articles a day, which drains a 100k backlog in about three
      # days without ever provoking a 429.
      #
      # Once the queue is empty set FOOLWATCH_BACKFILL=0 and the daily run
      # alone keeps things current.
      FOOLWATCH_BACKFILL_START: "00:00"
      FOOLWATCH_BACKFILL_END: "23:59"
      FOOLWATCH_BACKFILL_BATCH: "1200"
      FOOLWATCH_RPS: "0.4"
      FOOLWATCH_WORKERS: "2"
    # The worker serves no HTTP, so it proves liveness by writing to its own
    # database — which is exactly the failure mode trap #2 describes.
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import sqlite3;c=sqlite3.connect('/app/data/foolwatch.db');c.execute('CREATE TABLE IF NOT EXISTS _health(t INTEGER)');c.execute('INSERT INTO _health VALUES(1)');c.execute('DELETE FROM _health');c.commit()\""]
      interval: 5m
      timeout: 20s
      retries: 3
      start_period: 1m
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  foolwatch-dashboard:
    image: ghcr.io/ty1999ler/motleyfool:latest
    container_name: foolwatch-dashboard
    command:
      - streamlit
      - run
      - foolwatch/dashboard.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    restart: unless-stopped
    ports:
      - "8531:8501"   # http://NAS-IP:8531 — LAN only, no login
    volumes:
      - ./data:/app/data
    environment:
      TZ: America/New_York
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=5).status==200 else 1)\""]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - com.centurylinklabs.watchtower.enable=true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
